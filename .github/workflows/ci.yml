name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite 与 zlib zstd 都需要较新的 Node
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 有个环节依赖正式的 @deepseek-ai/* 包（src/tools.js 用 dsh-tools 的
      # defineTool），它们声明在 devDependencies 里，必须真的装上，
      # 否则 node --test 会以 ERR_MODULE_NOT_FOUND 失败。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试
        run: node --test "test/*.test.js"

      - name: 语法检查（所有源文件可被解析）
        run: |
          for f in src/*.js; do node --check "$f"; done
